name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Setup where steps will be executed
    defaults:
      run:
        working-directory: ./frontend

    steps:
    # Get code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    # Install dependencies
    - name: Install dependencies
      run: npm ci

    # Build frontend
    - name: Build frontend
      run: npm run build
