[project]
name = "jpconjugation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Agtdbx", email = "auguste.deroubaix@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "jaconv>=0.5.0",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
]

[project.scripts]
jpconjugation = "jpconjugation:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Ignore spécifiquement les avertissements de dépréciation venant de ces modules
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:anyio.*"
]
