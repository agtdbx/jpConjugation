name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    # Setup where steps will be executed
    defaults:
      run:
        working-directory: ./backend

    steps:
    # Get code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup environment
    - name: Setup uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    # Install dependencies
    - name: Install dependencies
      run: uv sync --frozen

    # Test backend
    - name: Build frontend
      run: uv run pytest src/tests

  fronend-test:
    runs-on: ubuntu-latest

    # Setup where steps will be executed
    defaults:
      run:
        working-directory: ./frontend

    steps:
    # Get code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    # Install dependencies
    - name: Install dependencies
      run: npm ci

    # Lint code
    - name: Run ESLint
      run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0

    # Type Check Code
    - name: TypeScript Type Check
      run: npx tsc --noEmit

    # Build frontend
    - name: Build frontend
      run: npm run build
